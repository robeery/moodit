name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true

      - name: Create CI environment asset
        run: |
          cat > .env <<'EOF'
          GEMINI_API_KEY=
          OPENAI_API_KEY=
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift and build_runner files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files are committed
        run: |
          git status --short
          git diff --stat
          git diff --exit-code

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  model-tests:
    name: Model tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true

      - name: Create CI environment asset
        run: |
          cat > .env <<'EOF'
          GEMINI_API_KEY=
          OPENAI_API_KEY=
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run model tests
        run: flutter test test/model

  basic-image-tests:
